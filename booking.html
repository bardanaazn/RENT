<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking Mobil - RentalinAJA</title>
    <style>
        body, html {
            /* Menggunakan min-height dan memastikan tidak ada margin sisa */
            min-height: 100vh; 
            margin: 0; 
            font-family: 'Segoe UI', sans-serif; 
            color: white;
            background-color: #121212; /* Warna dasar cadangan jika gambar lambat dimuat */
        }

        .bg-image {
            background-image: linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.7)), url('avanza.jpg');
            background-position: center; 
            background-repeat: no-repeat; 
            background-size: cover;
            background-attachment: fixed; /* 🌟 KUNCI: Membuat gambar latar terkunci kokoh saat pop-up muncul */
            
            /* Memaksa elemen selalu memenuhi satu layar penuh */
            min-height: 100vh; 
            width: 100%;
            display: flex; 
            align-items: center; 
            justify-content: center;
        }

        /* --- PENGAMAN TAMBAHAN UNTUK KHUSUS SWEETALERT2 --- */
        html.swal2-shown, body.swal2-shown {
            height: 100% !important;
            overflow: hidden !important; /* Mencegah layar bergeser/scrolling liar saat pop-up aktif */
        }
        .booking-card {
            background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(10px);
            padding: 40px; border-radius: 15px; width: 100%; max-width: 450px;
            border: 1px solid rgba(255, 255, 255, 0.2); text-align: center;
        }
        h2 { margin-bottom: 10px; color: #FFA500; }
        select, input {
            width: 100%; padding: 12px; margin: 10px 0; border-radius: 25px;
            border: none; background: rgba(255, 255, 255, 0.9); box-sizing: border-box;
        }
        .btn-pesan {
            width: 100%; padding: 12px; background-color: #FFA500; color: black;
            border: none; border-radius: 25px; cursor: pointer; font-weight: bold;
            font-size: 16px; margin-top: 20px; transition: 0.3s;
        }
        .btn-pesan:hover { background-color: #e69500; transform: scale(1.02); }
        .harga-estimasi { font-size: 18px; font-weight: bold; margin-top: 15px; color: #FFA500; }

        /* --- MEMAKSA SWEETALERT2 AGAR PROPORSIAL & TIDAK GEPENG --- */
        .swal2-popup {
            width: 480px !important; /* Memaksa lebar kotak menjadi ideal */
            padding: 30px 20px !important; /* Memberikan ruang napas di dalam kotak */
        }

        .swal2-styled.swal2-confirm {
            padding: 12px 35px !important; /* Membuat tombol tebal dan lebar ke samping */
            border-radius: 25px !important; /* Mengubah bentuk tombol menjadi kapsul bulat murni */
            font-size: 16px !important;
            font-weight: bold !important;
            background-color: #25D366 !important; /* Memastikan warna hijau WA asli terkunci */
            box-shadow: 0 4px 12px rgba(37, 211, 102, 0.3) !important; /* Efek glow halus */
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>

<div class="bg-image">
    <div class="booking-card">
        <h2>Form Pemesanan</h2>
        <p>Halo <span id="namaUser" style="font-weight: bold;">User</span>, silakan lengkapi pesanan Anda.</p>
        
        <form id="bookingForm">
            <select id="pilihMobil" onchange="hitungHarga()">
                <option value="" disabled selected>Pilih Armada</option>
                <option value="Avanza">Toyota Avanza</option>
                <option value="Jazz">Honda Jazz RS</option>
            </select>

            <select id="tipeDurasi" onchange="ubahPlaceholder(); hitungHarga();">
                <option value="Jam">Sewa Per Jam</option>
                <option value="Hari">Sewa Per Hari</option>
            </select>
            
            <input type="number" id="durasiSewa" placeholder="Durasi Sewa (Jam)" min="1" oninput="hitungHarga()">
            
            <div class="harga-estimasi">Total: <span id="totalDisplay">Rp 0</span></div>
            
            <button type="button" class="btn-pesan" onclick="buatPesanan()">KONFIRMASI PESANAN</button>
        </form>
        
        <p style="margin-top: 20px;"><a href="index.html" style="color: white; text-decoration: none; font-size: 14px;">← Kembali ke Beranda</a></p>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="auth.js"></script>
<script>
    document.addEventListener("DOMContentLoaded", function() {
        const user = localStorage.getItem('userNama');
        if (!user) {
            alert("Harap login terlebih dahulu!");
            window.location.href = "login.html";
        } else {
            document.getElementById('namaUser').innerText = user;
        }
    });

    // Fungsi untuk mengubah teks placeholder input sesuai tipe durasi yang dipilih
    function ubahPlaceholder() {
        const tipe = document.getElementById('tipeDurasi').value;
        document.getElementById('durasiSewa').placeholder = "Durasi Sewa (" + tipe + ")";
    }

    // LOGIKA MATEMATIKA MULTI-TARIF (JAM & HARI)
    function hitungHarga() {
        const mobil = document.getElementById('pilihMobil').value;
        const tipe = document.getElementById('tipeDurasi').value;
        const durasi = parseInt(document.getElementById('durasiSewa').value) || 0;
        
        let tarif = 0;

        if (mobil === 'Avanza') {
            tarif = (tipe === 'Jam') ? 150000 : 1000000;
        } else if (mobil === 'Jazz') {
            tarif = (tipe === 'Jam') ? 175000 : 1100000;
        }
        
        if (mobil && durasi > 0) {
            const total = tarif * durasi;
            document.getElementById('totalDisplay').innerText = "Rp " + total.toLocaleString('id-ID');
            return total;
        }
        
        document.getElementById('totalDisplay').innerText = "Rp 0";
        return 0;
    }
</script>

</body>
</html>
