<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - RentalinAJA</title>
    <style>
        /* Konsisten dengan desain di image_86b776.jpg */
        body, html {
            height: 100%;
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            color: white;
        }

        .bg-image {
            background-image: linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.7)), url('jazz3.jpg');
            height: 100%;
            background-position: center;
            background-repeat: no-repeat;
            background-size: cover;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 40px;
            border-radius: 15px;
            width: 100%;
            max-width: 380px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            text-align: center;
        }

        h2 {
            margin-bottom: 10px;
            font-size: 28px;
            font-weight: bold;
        }

        p {
            font-size: 14px;
            margin-bottom: 25px;
            color: #ddd;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 25px;
            border: none;
            background: rgba(255, 255, 255, 0.9);
            box-sizing: border-box;
            font-size: 14px;
            outline: none;
        }

        /* Tombol Oranye sesuai dengan branding di image_86b776.jpg */
        .btn-login {
            width: 100%;
            padding: 12px;
            background-color: #FFA500;
            color: black;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
            margin-top: 15px;
            transition: 0.3s;
        }

        .btn-login:hover {
            background-color: #e69500;
            transform: scale(1.02);
        }

        .footer-link {
            margin-top: 25px;
            font-size: 14px;
        }

        .footer-link a {
            color: #FFA500;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="bg-image">
    <div class="login-card">
        <h2>Login</h2>
        <p>Masuk untuk mulai memesan armada kami.</p>
        
        <form id="loginForm">
            <input type="email" id="loginEmail" placeholder="Email Anda" required>
            <input type="password" id="loginPassword" placeholder="Password" required>
            
            <button type="button" class="btn-login" onclick="handleLogin()">MASUK SEKARANG</button>
        </form>

        <div class="footer-link">
            Belum punya akun? <a href="register.html">Daftar di sini</a>
        </div>
    </div>
</div>

<!-- Menghubungkan ke logika auth.js yang ada di folder RENT -->
<script src="auth.js"></script>

</body>
</html>
