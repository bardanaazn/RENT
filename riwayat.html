<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Riwayat Pesanan - RentalinAJA</title>
    <!-- Bootstrap CSS untuk Tabel -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #121212;
            color: white;
            font-family: 'Segoe UI', sans-serif;
        }
        .container { margin-top: 50px; }
        .history-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 30px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        h2 { color: #FFA500; margin-bottom: 30px; }
        .table { color: white; }
        .badge-pending { background-color: #ffd700; color: black; } /* Kuning */
        .badge-success { background-color: #28a745; } /* Hijau */
    </style>
</head>
<body>

<div class="container">
    <div class="history-card">
        <h2>Riwayat Pesanan Anda</h2>
        <p>Halo <span id="userName" class="fw-bold"></span>, berikut adalah daftar pesanan Anda:</p>
        
        <div class="table-responsive">
            <table class="table table-hover mt-3">
                <thead class="table-dark">
                    <tr>
                        <th>Mobil</th>
                        <th>Durasi</th> 
                        <th>Total Harga</th>
                        <th>Status</th>
                        <th>Aksi</th> </tr>
                </thead>
                <tbody id="tabelRiwayat">
                    <!-- Data akan muncul di sini melalui JS -->
                </tbody>
            </table>
        </div>
        
        <a href="index.html" class="btn btn-outline-warning mt-4"> kembali ke Beranda</a>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="auth.js"></script>
<script>
    // Jalankan fungsi ambil data saat halaman dibuka
    document.addEventListener("DOMContentLoaded", () => {
        const user = localStorage.getItem('userNama');
        if (!user) {
            window.location.href = "login.html";
        } else {
            document.getElementById('userName').innerText = user;
            ambilRiwayatPesanan(user);
        }
    });
</script>

</body>
</html>
